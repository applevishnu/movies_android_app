pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
}

rootProject.name = "movies_android_app"
include ':app'

setBinding(new Binding([gradle: this]))
evaluate(new File(settingsDir, '../movies_flutter_module/.android/include_flutter.groovy'))

// Exclude dev-only integration_test from native host build
rootProject.children.removeIf { it.name == 'integration_test' }
